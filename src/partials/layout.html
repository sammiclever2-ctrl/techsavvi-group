<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="robots" content="{{robots}}" />
  <link rel="canonical" href="{{canonical}}" />
  <meta name="theme-color" content="#0B1F45" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="{{name}}" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:url" content="{{canonical}}" />
  <meta property="og:image" content="{{url}}/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="/assets/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/site.css" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "{{name}}",
    "url": "{{url}}",
    "logo": "{{url}}/assets/logo-mark.png",
    "description": "{{description}}",
    "foundingDate": "2024",
    "openingHours": "Mo-Su 00:00-23:59",
    "telephone": "{{phoneHref}}",
    "email": "{{email}}",
    "sameAs": ["{{instagram}}", "{{tiktok}}"],
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Blade Chattels, Ibere Abaa",
      "addressLocality": "Ogbomoso",
      "addressRegion": "Oyo State",
      "addressCountry": "NG"
    }
  }
  </script>
</head>
<body class="bg-white text-ink font-sans antialiased">
  <a href="#main" class="skip-link">Skip to content</a>
  {{header}}
  <main id="main">
{{content}}
  </main>
  {{footer}}
  <script src="/assets/main.js" defer></script>
</body>
</html>
